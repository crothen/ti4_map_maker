  <g transform="translate(150, 250)">
    <path d="M150,-20 L220,20 L180,60 L100,10 Z" class="shadow" />
    
    <path d="M60,60 L160,20 L180,50 L80,100 Z" class="base" />
    
    <path d="M60,60 L160,20 L150,15 L50,55 Z" class="highlight" />
    
    <ellipse cx="70" cy="80" rx="25" ry="20" transform="rotate(-25)" class="base" />
